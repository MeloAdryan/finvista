spring.application.name=FinVista

server.port=${PORT:8080}

spring.datasource.url=${FINVISTA_DB_URL}
spring.datasource.username=${FINVISTA_DB_USERNAME}
spring.datasource.password=${FINVISTA_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

finvista.cors.allowed-origins=${FINVISTA_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Usuario Administrador
finvista.admin.nome=${FINVISTA_ADMIN_NOME:}
finvista.admin.email=${FINVISTA_ADMIN_EMAIL:}
finvista.admin.senha=${FINVISTA_ADMIN_SENHA:}

# Usuario Cliente
finvista.cliente.nome=${FINVISTA_CLIENTE_NOME:}
finvista.cliente.email=${FINVISTA_CLIENTE_EMAIL:}
finvista.cliente.senha=${FINVISTA_CLIENTE_SENHA:}

# Sessao HTTP em producao
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

